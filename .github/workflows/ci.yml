name: CI — Lint & Test

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     xai
          POSTGRES_PASSWORD: xai_test
          POSTGRES_DB:       xai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL:  postgresql://xai:xai_test@localhost:5432/xai_test
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      GROQ_API_KEY:  ""   # narration disabled in CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint (ruff)
        run: ruff check backend/ --select E,F,W,I --ignore E501

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short -q \
            --junitxml=pytest-results.xml \
            --override-ini="junit_suite_name=xai-backend"
        continue-on-error: false

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ github.run_id }}
          path: pytest-results.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vite)
        working-directory: frontend
        run: npm run build -- --outDir dist
        # Use local dist here; Docker build copies to backend/static/ separately.

      - name: Check build output exists
        run: |
          [ -f frontend/dist/index.html ] || (echo "ERROR: index.html not found in build output"; exit 1)
          echo "✓ Frontend build succeeded ($(du -sh frontend/dist | cut -f1) output)"

  smoke:
    name: Smoke Tests (post-deploy gate)
    runs-on: ubuntu-latest
    needs: [lint-test, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Health check
        run: |
          curl -sf --max-time 10 "https://${{ secrets.EC2_HOST }}/health" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok', d"
          echo "✓ /health OK"

      - name: Predict endpoint
        run: |
          PAYLOAD='{"login_frequency_weekly":3,"avg_session_duration_min":45,"forum_posts_count":2,"video_completion_rate":0.6,"quiz_avg_score":55,"quiz_completion_rate":0.7,"assignment_submission_rate":0.65,"days_since_last_activity":7,"prior_course_completions":1,"current_week_in_course":6,"missed_deadlines_count":2,"help_requests_count":1,"engagement_latent_1":0,"engagement_latent_2":0,"engagement_latent_3":0}'
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X POST "https://${{ secrets.EC2_HOST }}/predict" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          [ "$STATUS" = "200" ] || (echo "ERROR: /predict returned $STATUS"; exit 1)
          echo "✓ /predict OK (HTTP $STATUS)"

      - name: Frontend loads (SPA)
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${{ secrets.EC2_HOST }}/login")
          [ "$STATUS" = "200" ] || (echo "ERROR: /login SPA route returned $STATUS"; exit 1)
          echo "✓ React SPA /login OK (HTTP $STATUS)"

      - name: Retrain endpoint rejects unauthenticated calls
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${{ secrets.EC2_HOST }}/mlops/retrain")
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || \
            (echo "ERROR: /mlops/retrain should reject unauthenticated (got $STATUS)"; exit 1)
          echo "✓ /mlops/retrain auth guard OK (HTTP $STATUS)"

      - name: Reload endpoint rejects unauthenticated calls
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://${{ secrets.EC2_HOST }}/mlops/reload")
          [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ] || \
            (echo "ERROR: /mlops/reload should reject unauthenticated (got $STATUS)"; exit 1)
          echo "✓ /mlops/reload auth guard OK (HTTP $STATUS)"

      - name: Drift report
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://${{ secrets.EC2_HOST }}/mlops/drift-report")
          [ "$STATUS" = "200" ] || (echo "ERROR: /mlops/drift-report returned $STATUS"; exit 1)
          echo "✓ /mlops/drift-report OK"

      - name: Smoke test summary
        if: always()
        run: |
          echo "### Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Endpoints checked: /health, /predict, /login (SPA), /mlops/retrain (auth), /mlops/reload (auth), /mlops/drift-report" >> $GITHUB_STEP_SUMMARY

