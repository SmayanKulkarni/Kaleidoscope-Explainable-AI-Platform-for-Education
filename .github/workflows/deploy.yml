name: CD — Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:   # allow manual trigger

# Only one deploy at a time
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-push:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag:   ${{ steps.meta.outputs.image_tag }}
      image_digest: ${{ steps.digest.outputs.digest }}
      full_image:   ${{ steps.digest.outputs.full_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          IMAGE_TAG="${SHORT_SHA}-$(date +%Y%m%d%H%M%S)"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: ${IMAGE_TAG}"

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ secrets.ECR_REPO_URL }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ secrets.ECR_REPO_URL }}:cache
          cache-to:   type=registry,ref=${{ secrets.ECR_REPO_URL }}:cache,mode=max

      - name: Export image digest
        id: digest
        run: |
          echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ secrets.ECR_REPO_URL }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-push
    environment: production

    steps:
      - name: Checkout (for deploy scripts)
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ec2-user
          key:      ${{ secrets.EC2_SSH_KEY }}
          timeout:  300s
          script: |
            set -euo pipefail

            # ── Write secrets to env file ──────────────────────────────────
            sudo tee /opt/xai/.env > /dev/null <<ENV
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            JWT_ALGORITHM=HS256
            JWT_EXPIRE_MIN=1440
            ENV
            sudo chmod 600 /opt/xai/.env

            # ── Pin to exact immutable image ───────────────────────────────
            PINNED_IMAGE="${{ needs.build-push.outputs.full_image }}"
            PINNED_TAG="${{ needs.build-push.outputs.image_tag }}"
            echo "Deploying pinned image: ${PINNED_IMAGE}"

            # ── Record previous running image for rollback ─────────────────
            PREV_IMAGE=$(docker inspect xai-api --format='{{.Config.Image}}' 2>/dev/null || echo "none")
            echo "Previous image: ${PREV_IMAGE}"
            sudo tee /opt/xai/deploy-history.json > /dev/null <<HIST
            {"deployed_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","image":"${PINNED_IMAGE}","tag":"${PINNED_TAG}","previous":"${PREV_IMAGE}","commit":"${{ github.sha }}"}
            HIST

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin ${{ secrets.ECR_REPO_URL }}
            docker pull "${PINNED_IMAGE}"

            # ── Write pinned image name into env file for systemd ──────────
            sudo tee -a /opt/xai/.env > /dev/null <<ENV
            XAI_IMAGE=${PINNED_IMAGE}
            ENV
            sudo chmod 600 /opt/xai/.env

            # ── Run DB migrations before restarting ──────────────────────
            docker run --rm \
              -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
              "${PINNED_IMAGE}" \
              python -m alembic upgrade head

            # ── Graceful rolling restart via systemd ──────────────────────
            sudo systemctl restart xai-api

            # ── Wait for health check ─────────────────────────────────────
            for i in $(seq 1 12); do
              sleep 10
              if curl -sf http://localhost:8000/health > /dev/null; then
                echo "Health check passed (attempt $i)"
                exit 0
              fi
              echo "Waiting... attempt $i/12"
            done
            echo "ERROR: Health check failed after 2 minutes — rolling back to ${PREV_IMAGE}"
            # Rollback: restart with previous image written into env
            sudo sed -i "s|XAI_IMAGE=.*|XAI_IMAGE=${PREV_IMAGE}|" /opt/xai/.env
            sudo systemctl restart xai-api
            exit 1

      - name: Deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag**: \`${{ needs.build-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image digest (immutable)**: \`${{ needs.build-push.outputs.image_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Full image ref**: \`${{ needs.build-push.outputs.full_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Host**: ${{ secrets.EC2_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: https://${{ secrets.EC2_HOST }}/docs" >> $GITHUB_STEP_SUMMARY
