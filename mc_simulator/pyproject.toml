[build-system]
requires      = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name            = "mc_simulator"
version         = "0.1.0"
description     = "Monte Carlo trajectory simulator — Rust/PyO3 backend"
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
