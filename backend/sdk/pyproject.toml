[build-system]
requires      = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "xai-learner-sdk"
version         = "0.1.0"
description     = "Python SDK for the XAI Learning Recommendation System API"
requires-python = ">=3.9"
dependencies    = []  # httpx is optional; falls back to urllib

[project.optional-dependencies]
full = ["httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
